name: Build and publish Windows release
on:
  push:
    branches: [main]
    paths: ['Wall.csproj', '.github/workflows/release.yml', 'scripts/Publish-Release.ps1', '.config/dotnet-tools.json']
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: lumawall-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          [xml]$project = Get-Content Wall.csproj
          $version = [string]$project.Project.PropertyGroup.Version
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag and project version differ.' }
          "value=$version" >> $env:GITHUB_OUTPUT
          gh release view "v$version" --repo $env:GITHUB_REPOSITORY 2>$null
          $exists = $LASTEXITCODE -eq 0
          "exists=$($exists.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          exit 0
      - name: Build and verify
        if: steps.version.outputs.exists != 'true'
        shell: pwsh
        run: |
          dotnet build Wall.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw 'Build failed.' }
          foreach ($test in @('--playlist-test', '--transform-test', '--contrast-test', '--batch-library-test')) {
            dotnet bin/Release/net8.0-windows/LumaWall.dll $test
            if ($LASTEXITCODE -ne 0) { throw "Failed: $test" }
          }
      - name: Create installer and update packages
        if: steps.version.outputs.exists != 'true'
        shell: pwsh
        run: ./scripts/Publish-Release.ps1 -Version '${{ steps.version.outputs.value }}'
      - name: Publish GitHub release
        if: steps.version.outputs.exists != 'true'
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.value }}'
          $files = @(Get-ChildItem "dist/releases-$version" -File | ForEach-Object FullName)
          gh release create "v$version" @files --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "LumaWall v$version" --notes-file RELEASE_NOTES.md --latest
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed.' }
